---
# Root-owned. The app user can write the activity stamp in the database
# directory, which only resets the idle clock. This directory holds the
# uptime snooze, and the app user cannot create files in a 0755 root dir.
- name: Create the idle-shutdown state directory
  ansible.builtin.file:
    path: "{{ idle_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the idle-shutdown settings
  ansible.builtin.template:
    src: idle.env.j2
    dest: /etc/dutch-blitz/idle.env
    owner: root
    group: root
    mode: "0644"

- name: Install the idle-shutdown command
  ansible.builtin.copy:
    src: dutch-blitz-idle
    dest: /usr/local/bin/dutch-blitz-idle
    owner: root
    group: root
    mode: "0755"

- name: Install the idle-shutdown service
  ansible.builtin.template:
    src: dutch-blitz-idle.service.j2
    dest: /etc/systemd/system/dutch-blitz-idle.service
    owner: root
    group: root
    mode: "0644"

- name: Install the idle-shutdown timer
  ansible.builtin.template:
    src: dutch-blitz-idle.timer.j2
    dest: /etc/systemd/system/dutch-blitz-idle.timer
    owner: root
    group: root
    mode: "0644"
