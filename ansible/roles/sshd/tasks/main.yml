---
# Amazon Linux 2023 OpenSSH uses the first value it sees for each keyword.
# sshd_config Includes /etc/ssh/sshd_config.d/*.conf before its own settings,
# in lexical order. 00- sorts ahead of 50-redhat.conf so these values win.
# KbdInteractiveAuthentication is the current name of ChallengeResponseAuthentication.
- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: ansible_os_family == "RedHat"
  tags: [sshd]

- name: Install sshd hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-dutch-blitz-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by dutch-blitz ansible sshd role.
      # Public-key login stays on. Password, keyboard-interactive, and root do not.
      # ChallengeResponseAuthentication is the older name of KbdInteractiveAuthentication.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
  become: true
  when: ansible_os_family == "RedHat"
  notify: Reload sshd
  tags: [sshd]

- name: Restore SELinux context on the sshd drop-in
  ansible.builtin.command:
    cmd: restorecon -v /etc/ssh/sshd_config.d/00-dutch-blitz-hardening.conf
  register: sshd_restorecon
  changed_when: >-
    'Relabeled' in (
      (sshd_restorecon.stdout | default('')) ~ (sshd_restorecon.stderr | default(''))
    )
  become: true
  when: ansible_os_family == "RedHat"
  notify: Reload sshd
  tags: [sshd]

- name: Confirm sshd drop-ins are included before later settings
  ansible.builtin.shell: |
    set -euo pipefail
    awk '
      /^[[:space:]]*#/ { next }
      /^[[:space:]]*Include[[:space:]]+\/etc\/ssh\/sshd_config\.d\// {
        if (!include_line) include_line = NR
      }
      /^[[:space:]]*(PasswordAuthentication|KbdInteractiveAuthentication|ChallengeResponseAuthentication|PermitRootLogin|PubkeyAuthentication)[[:space:]]+/ {
        if (!include_line) {
          print "setting-before-include:" $1
          exit 3
        }
      }
      END {
        if (!include_line) {
          print "missing-include"
          exit 2
        }
        print "ok"
      }
    ' /etc/ssh/sshd_config
  args:
    executable: /bin/bash
  register: sshd_include_order
  changed_when: false
  failed_when: false
  become: true
  when: ansible_os_family == "RedHat"
  tags: [sshd]

- name: Fail when the sshd drop-in cannot take effect
  ansible.builtin.fail:
    msg: >-
      /etc/ssh/sshd_config does not Include /etc/ssh/sshd_config.d before
      PasswordAuthentication, KbdInteractiveAuthentication, PermitRootLogin,
      or PubkeyAuthentication ({{ sshd_include_order.stdout | default('') | trim }}).
      OpenSSH keeps the first value, so the hardening drop-in would not apply.
      Refusing to reload sshd.
  when:
    - ansible_os_family == "RedHat"
    - sshd_include_order.rc | default(1) != 0
  tags: [sshd]

- name: Validate sshd configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false
  become: true
  when: ansible_os_family == "RedHat"
  tags: [sshd]

- name: Read effective sshd settings
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: sshd_effective
  changed_when: false
  become: true
  when: ansible_os_family == "RedHat"
  tags: [sshd]

- name: Assert sshd allows public keys only
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
      - "'permitrootlogin no' in sshd_effective.stdout_lines"
      - "'pubkeyauthentication yes' in sshd_effective.stdout_lines"
    fail_msg: >-
      sshd -T does not show PasswordAuthentication no,
      KbdInteractiveAuthentication no, PermitRootLogin no, and
      PubkeyAuthentication yes. Refusing to reload sshd.
  when: ansible_os_family == "RedHat"
  tags: [sshd]
