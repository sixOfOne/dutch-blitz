# Continuous integration for the Dutch Blitz scorekeeper.
#
# GitHub Actions reads this file and runs the jobs on a clean Ubuntu
# machine. The jobs install the repo's Python requirements, run ruff,
# mypy, and pytest, and check Terraform (fmt, tflint, validate). They
# do not receive Clerk keys or AWS credentials, and they never plan or
# apply infrastructure. The infra job is still named Terraform and Ansible
# so the branch ruleset matches. Ansible itself is gone.

name: CI

# Triggers: when a workflow run starts.
#
# pull_request runs for a new pull request, every new commit on it, and
# a pull request that is reopened. That run is the check mark on the
# pull request page.
#
# push runs only for main, which is the branch people merge into. Pushes
# to other branches are not listed. A pull-request branch already starts
# the pull_request run, and a second trigger would bill the minutes twice.
on:
  pull_request:
  push:
    branches:
      - main

# The built-in token only needs to read the repo so the checkout step
# can clone it. This workflow does not declare secrets, so CLERK_* and
# AWS credentials are not in the environment.
permissions:
  contents: read

# Every third-party action below is pinned to a full 40-character commit
# SHA, with the release tag in a comment on that line (for example
# `# v7.0.1`). A tag such as `@v7` is a movable pointer. If the action's
# maintainer retags it, or that account is compromised, the next run of
# this file executes the new commit with the token above. A SHA names
# one commit, so a rewritten tag does not change what CI runs. That is
# the supply-chain control: the code that runs is the code you reviewed.
# Dependabot reads the version comment and opens a pull request that
# updates the SHA and the comment together. The schedule is
# .github/dependabot.yml. The Security tab's action alerts follow
# version tags, not SHAs, so those alerts do not cover these pins. The
# weekly update is what moves them.

# Concurrency: one in-progress run per branch.
#
# github.head_ref is the source branch name on a pull request, and empty
# on a push. The fallback github.ref is then refs/heads/main. A second
# push to that same branch cancels the older run, so minutes are not
# spent finishing a commit that is already out of date.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Separate job from infra so a test failure and an infrastructure
  # failure show up as two checks on the pull request. They run at the
  # same time. A third job is not worth another machine: ruff and mypy
  # share this one with pytest, and tflint shares the infra machine.
  # The check names stay "Python tests" and "Terraform and Ansible"
  # so an existing ruleset does not have to be edited. Ansible itself
  # is gone; the name is what the ruleset matches.
  tests:
    name: Python tests
    # runs-on picks the machine. ubuntu-latest is a new GitHub-hosted
    # Ubuntu VM for this job. Nothing from a previous run is on it.
    runs-on: ubuntu-latest
    # Stop a stuck install well before the default six-hour job limit.
    timeout-minutes: 10

    steps:
      # A step is one thing the job does, in order.
      # `uses` downloads an action (someone else's program) pinned to a
      # commit. `run` is a shell command on this machine. Checkout is
      # `uses` because cloning is already written. pytest is `run`
      # because it is a command we type ourselves.
      #
      # Clone the commit that triggered the run. The default fetch is
      # only that commit, which is all the later steps need.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python 3.11 is the interpreter in the game-night image and the
      # version the README asks for. The host also installs it for the
      # backup and idle commands, which run outside the container.
      #
      # cache: pip stores downloaded wheels in the Actions cache. The
      # key includes a hash of the requirements files, so an edit
      # downloads again and an unchanged set is reused.
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-host.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt -r requirements-host.txt

      # ruff check is the linter. ruff format --check fails when a file
      # is not in the layout from pyproject.toml. Neither one runs the app.
      - name: Ruff lint
        run: ruff check app src tests

      - name: Ruff format check
        run: ruff format --check app src tests

      # mypy reads [tool.mypy] in pyproject.toml. It type-checks app/,
      # src/dutch_blitz_host, and tests. It does not execute them.
      - name: Mypy
        run: mypy

      # tests/fakes.py stubs Clerk. This step has no secrets, and the
      # suite does not call AWS. pytest.ini points Python at the repo
      # root and src/, so the app and the dutch_blitz_host CLI import.
      - name: Run pytest
        run: pytest

  infra:
    # The check name stays "Terraform and Ansible" so the branch ruleset
    # documented in docs/repo-security.md still matches. Ansible is gone.
    # Renaming the job would leave main waiting on a check that no longer runs.
    name: Terraform and Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The roots require Terraform >= 1.10.0 because the S3 backend
      # uses use_lockfile. 1.16.5 is a current stable release, pinned
      # so the check does not move under us. 1.10 is the first release
      # with that lock. DynamoDB locking is not used.
      #
      # terraform_wrapper is off. The wrapper captures command output
      # for later steps and can hide the real exit code. fmt -check and
      # validate should fail the job directly when they are unhappy.
      - name: Set up Terraform 1.16.5
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      # fmt compares each .tf file with the canonical layout. It does
      # not download providers and does not read credentials. -diff
      # prints the mismatch in the log when the check fails. This runs
      # before init so a formatting error fails before the provider
      # download.
      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive

      # tflint is a separate program from Terraform. setup-tflint
      # installs the v0.64.0 binary. The action itself is pinned to a
      # commit, with the release tag in the comment, so Dependabot
      # (the github-actions entry) can bump it. .tflint.hcl enables
      # the recommended Terraform rules and the AWS ruleset. deep_check
      # stays off: those rules call AWS, and this job has no credentials.
      # --init downloads the AWS plugin. The cache key is the config
      # file, so a plugin version bump downloads again.
      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Restore tflint plugin cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-plugins-${{ hashFiles('.tflint.hcl') }}

      - name: Run tflint
        run: |
          tflint --init
          tflint --recursive --config="${{ github.workspace }}/.tflint.hcl"

      # The AWS provider archive is large. Every root below uses
      # hashicorp/aws and hashicorp/null, so one cache directory serves
      # all of the inits in this job. Actions also restores the directory on
      # the next run. restore-keys accepts an older cache when a .tf
      # file changed but the providers did not, instead of downloading
      # from scratch.
      - name: Restore Terraform provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: |
            terraform-plugins-

      # init -backend=false downloads provider schemas only. It does not
      # configure remote state and does not read backend.hcl. The roots
      # have an s3 backend block; this flag is what keeps CI from
      # contacting the state bucket. There are no AWS credentials here.
      #
      # validate checks that the configuration is internally consistent.
      # It does not run plan or apply, so it creates nothing.
      # -var=enable_aws=false forces the local-only provider settings
      # (placeholder credentials, skipped account lookup). The step
      # therefore does not call AWS.
      #
      # TF_IN_AUTOMATION tells Terraform it is not a person at a prompt.
      # TF_PLUGIN_CACHE_DIR is the directory restored above. The same
      # directory is filled on a cache miss and reused for every root.
      - name: Validate each Terraform root
        env:
          TF_IN_AUTOMATION: "true"
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in terraform terraform/backup terraform/state terraform/iam-bot terraform/game-role terraform/gha-deployer; do
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color -var=enable_aws=false
          done

