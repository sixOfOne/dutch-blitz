# Continuous integration for the Dutch Blitz scorekeeper.
#
# GitHub Actions reads this file and runs the jobs on a clean Ubuntu
# machine. The jobs install the repo's Python requirements, run pytest,
# and check Terraform and Ansible. They do not receive Clerk keys or
# AWS credentials, and they never plan or apply infrastructure.

name: CI

# Triggers: when a workflow run starts.
#
# pull_request runs for a new pull request, every new commit on it, and
# a pull request that is reopened. That run is the check mark on the
# pull request page.
#
# push runs only for main, which is the branch people merge into. Pushes
# to other branches are not listed. A pull-request branch already starts
# the pull_request run, and a second trigger would bill the minutes twice.
on:
  pull_request:
  push:
    branches:
      - main

# The built-in token only needs to read the repo so the checkout step
# can clone it. This workflow does not declare secrets, so CLERK_* and
# AWS credentials are not in the environment.
permissions:
  contents: read

# Concurrency: one in-progress run per branch.
#
# github.head_ref is the source branch name on a pull request, and empty
# on a push. The fallback github.ref is then refs/heads/main. A second
# push to that same branch cancels the older run, so minutes are not
# spent finishing a commit that is already out of date.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Separate job from infra so a test failure and an infrastructure
  # failure show up as two checks on the pull request. They run at the
  # same time. A third job is not worth another machine: Terraform and
  # Ansible share this one.
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    # Stop a stuck install well before the default six-hour job limit.
    timeout-minutes: 10

    steps:
      # Clone the commit that triggered the run. The default fetch is
      # only that commit, which is all the later steps need.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Python 3.11 is the interpreter installed on the game-night host
      # (ansible/roles/app) and the version the README asks for.
      #
      # cache: pip stores downloaded wheels in the Actions cache. The
      # key includes a hash of the two requirements files, so an edit
      # to either file downloads again and an unchanged pair is reused.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      # tests/fakes.py stubs Clerk. This step has no secrets, and the
      # suite does not call AWS. pytest.ini points Python at the repo
      # root and src/, so the app and the dutch_blitz_host CLI import.
      - name: Run pytest
        run: pytest

  infra:
    name: Terraform and Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The roots require Terraform >= 1.10.0 because the S3 backend
      # uses use_lockfile. 1.16.5 is a current stable release, pinned
      # so the check does not move under us. 1.10 is the first release
      # with that lock. DynamoDB locking is not used.
      #
      # terraform_wrapper is off. The wrapper captures command output
      # for later steps and can hide the real exit code. fmt -check and
      # validate should fail the job directly when they are unhappy.
      - name: Set up Terraform 1.16.5
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      # fmt compares each .tf file with the canonical layout. It does
      # not download providers and does not read credentials. -diff
      # prints the mismatch in the log when the check fails. This runs
      # before init so a formatting error fails before the provider
      # download.
      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive

      # The AWS provider archive is large. Every root below uses
      # hashicorp/aws and hashicorp/null, so one cache directory serves
      # all of the inits in this job. Actions also restores the directory on
      # the next run. restore-keys accepts an older cache when a .tf
      # file changed but the providers did not, instead of downloading
      # from scratch.
      - name: Restore Terraform provider cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: |
            terraform-plugins-

      # init -backend=false downloads provider schemas only. It does not
      # configure remote state and does not read backend.hcl. The roots
      # have an s3 backend block; this flag is what keeps CI from
      # contacting the state bucket. There are no AWS credentials here.
      #
      # validate checks that the configuration is internally consistent.
      # It does not run plan or apply, so it creates nothing.
      # -var=enable_aws=false forces the local-only provider settings
      # (placeholder credentials, skipped account lookup). The step
      # therefore does not call AWS.
      #
      # TF_IN_AUTOMATION tells Terraform it is not a person at a prompt.
      # TF_PLUGIN_CACHE_DIR is the directory restored above. The same
      # directory is filled on a cache miss and reused for every root.
      - name: Validate each Terraform root
        env:
          TF_IN_AUTOMATION: "true"
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in terraform terraform/backup terraform/state terraform/iam-bot; do
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color -var=enable_aws=false
          done

      # Same minor version as the test job. ansible-core 2.19 installs
      # on 3.11. ansible-core 2.20 and newer require 3.12, which the
      # game-night host does not use.
      - name: Set up Python 3.11 for Ansible
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # ansible-core is enough: the playbook uses ansible.builtin only.
      # The full Ansible package would download hundreds of collections.
      # Pins match the Continuous integration section of the README.
      # A newer ansible-lint can add rules; the pin keeps that from
      # failing CI until someone chooses to upgrade.
      - name: Install Ansible tools
        run: python -m pip install --disable-pip-version-check 'ansible-core==2.19.14' 'ansible-lint==26.9.0'

      # --syntax-check parses the playbook and roles. It does not
      # connect to a host. syntax-check.yml is a stand-in for the
      # inventory the CLI writes at configure time (that file is gitignored).
      - name: Ansible syntax check
        run: ansible-playbook ansible/playbook.yml --syntax-check -i ansible/inventory/syntax-check.yml

      # Lint catches problems a parse does not, such as a task that sets
      # become_user without become. --offline skips the schema update
      # ansible-lint would otherwise download on a fresh machine.
      - name: Ansible lint
        run: ansible-lint ansible/playbook.yml --offline --nocolor
