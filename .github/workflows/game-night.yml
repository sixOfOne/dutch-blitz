# Game night button. workflow_dispatch only.
#
# The game-night environment must exist before the first run, with
# Jeremy as a required reviewer. A run that creates the environment
# on its own is not reviewed. The variable AWS_ROLE_ARN is the
# deployer role from terraform/gha-deployer. It is a variable, not a
# secret. Clerk keys and the gitignored tfvars are environment
# secrets. This file stores no AWS access key.
#
# The role trusts token.actions.githubusercontent.com when aud is
# sts.amazonaws.com and sub is either
# repo:sixOfOne@50211093/dutch-blitz@1413603165:environment:game-night
# or repo:sixOfOne/dutch-blitz:environment:game-night.
# Select the main branch when you run it. The environment's
# deployment branch rule is what limits the ref. The session lasts
# at most one hour.
#
# app_image is a sha- tag whose manifest exists. The commit at
# origin/main is used when that tag was published. Otherwise the
# workflow reads the moving main tag, then the newest successful
# Image run on main. Terraform does not receive main or latest.
#
# down initializes the S3 backend before it reads outputs. A new
# runner has no .terraform directory, so that init is what makes the
# state from up visible. skip_backup defaults to false. Turn it on
# only with down, and only when the server never finished booting:
# cloud-init never installed the host package, so there is no score
# book to upload. The workflow then passes --skip-backup.
name: Game night

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        required: true
        default: status
        options:
          - status
          - up
          - backup
          - down
      app_image:
        description: Optional sha- tag or digest. Empty uses the newest published image.
        type: string
        required: false
        default: ""
      skip_backup:
        description: >-
          With down, skip the final snapshot. Safe when the server never
          finished booting, so there is no score book to upload.
        type: boolean
        required: false
        default: false

# No permissions at workflow scope. The job below sets the ones it needs.
permissions: {}

# One night at a time. A second click waits. It does not cancel the
# apply that is already talking to AWS.
concurrency:
  group: game-night
  cancel-in-progress: false

jobs:
  night:
    name: Game night
    runs-on: ubuntu-latest
    environment: game-night
    timeout-minutes: 50
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the deployer role variable
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          arn = os.environ.get("AWS_ROLE_ARN", "")
          pattern = r"arn:aws:iam::[0-9]{12}:role/dutch-blitz-gha-deployer"
          if re.fullmatch(pattern, arn) is None:
              print(
                  "Set the game-night environment variable AWS_ROLE_ARN to the "
                  "dutch-blitz-gha-deployer role ARN. It is a variable, not a secret.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: game-night-${{ github.run_id }}
          role-duration-seconds: 3600
          audience: sts.amazonaws.com
          mask-aws-account-id: true

      - name: Set up Terraform 1.16.5
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-host.txt

      - name: Install the controller
        run: python -m pip install --disable-pip-version-check -r requirements-host.txt

      - name: Resolve the image pin
        id: image
        env:
          APP_IMAGE_INPUT: ${{ inputs.app_image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          sys.path.insert(0, "src")
          from dutch_blitz_host.image_pin import resolve_app_image, write_github_output

          subprocess.run(
              ["git", "fetch", "--no-tags", "--depth=1", "origin", "main"],
              check=True,
          )
          full = subprocess.check_output(
              ["git", "rev-parse", "FETCH_HEAD"],
              text=True,
          ).strip()
          image = resolve_app_image(
              explicit=os.environ.get("APP_IMAGE_INPUT", ""),
              main_sha=full,
              github_repository=os.environ["GITHUB_REPOSITORY"],
              github_token=os.environ.get("GITHUB_TOKEN", ""),
          )
          write_github_output(os.environ["GITHUB_OUTPUT"], image)
          print(f"app_image={image}")
          PY

      - name: Run the game-night command
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
          BACKEND_HCL: ${{ secrets.BACKEND_HCL }}
          TF_VAR_app_image: ${{ steps.image.outputs.app_image }}
          APP_ACTION: ${{ inputs.action }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
          DUTCH_BLITZ_TFVARS: ${{ runner.temp }}/terraform.tfvars
          DUTCH_BLITZ_BACKEND_CONFIG: ${{ runner.temp }}/backend.hcl
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          bodies = {
              "terraform.tfvars": os.environ.get("TERRAFORM_TFVARS", ""),
              "backend.hcl": os.environ.get("BACKEND_HCL", ""),
          }
          for name, body in bodies.items():
              if not body.strip():
                  raise SystemExit(f"{name} secret is empty.")
              if "clerk_publishable_key" in body or "clerk_secret_key" in body:
                  raise SystemExit(f"{name} must not contain Clerk keys.")
              if name == "terraform.tfvars":
                  for raw_line in body.splitlines():
                      line = raw_line.split("#", 1)[0].strip()
                      if line.startswith("app_image"):
                          raise SystemExit(
                              "TERRAFORM_TFVARS must not set app_image. "
                              "The workflow sets TF_VAR_app_image."
                          )
              if not body.endswith("\n"):
                  body += "\n"
              path = root / name
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  handle.write(body)
          action = os.environ.get("APP_ACTION", "")
          if action not in {"up", "down", "backup", "status"}:
              raise SystemExit("Unknown action.")
          skip = os.environ.get("SKIP_BACKUP", "false") == "true"
          if skip and action != "down":
              raise SystemExit("skip_backup applies only to down.")
          argv = [sys.executable, "-m", "dutch_blitz_host", action]
          if skip:
              argv.append("--skip-backup")
          env = os.environ.copy()
          env["PYTHONPATH"] = "src"
          os.execvpe(sys.executable, argv, env)
          PY
