# Dependabot version updates.
#
# GitHub reads this file and opens pull requests when a dependency has a
# newer release. It does not merge them. You review each one the same way
# as any other pull request: the CI checks in .github/workflows/ci.yml
# have to pass.
#
# This file is the schedule for ordinary version updates. It is separate
# from Dependabot alerts and Dependabot security updates, which you turn
# on in the repository settings. Those steps are in docs/repo-security.md.
# Alerts tell you a dependency has a known vulnerability. Security updates
# open a pull request for that fix. The entries below also open pull
# requests when nothing is vulnerable, so versions do not sit still for
# months.
#
# version: 2 is the only syntax Dependabot accepts.

version: 2
updates:
  # pip: Python packages in the repository root.
  #
  # directory "/" means the root. Dependabot reads every requirements
  # file there: requirements.txt (the app), requirements-dev.txt (the
  # test tools), and requirements-host.txt (boto3 for the controller).
  # One entry covers all three.
  # It does not look at version pins that are written inside a workflow
  # run: line. Those are not a requirements file.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      # Once a week, on Monday. daily would open pull requests on
      # weekdays. monthly is easy to forget.
      interval: "weekly"
      day: "monday"
    # At most five open version-update pull requests for this entry.
    # Dependabot waits once the cap is reached. Five is GitHub's
    # default, written here so the cap is visible. Security-update pull
    # requests do not count toward it, so a vulnerability fix is not
    # stuck behind a queue of ordinary bumps.
    open-pull-requests-limit: 5
    groups:
      # minor is the middle number (1.2.3 -> 1.3.0). patch is the last
      # number (1.2.3 -> 1.2.4). Matching updates are bundled into one
      # pull request. A major bump (1.2.3 -> 2.0.0) stays its own pull
      # request, because that is the release that can change behavior.
      minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # github-actions: the actions named on uses: lines in
  # .github/workflows/. directory must be "/" for this ecosystem.
  # Dependabot searches .github/workflows itself.
  #
  # The workflow pins each action to a commit SHA and puts the release
  # tag in a comment, such as "# v7.0.1". Dependabot reads that comment,
  # finds the newer release, and updates both the SHA and the comment
  # in the pull request. Without the comment it cannot tell which
  # release the SHA stands for.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Same bundle as the pip entry: minor and patch together, majors
      # left as their own pull requests. A major action release can
      # rename inputs, so it should be read on its own.
      minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # terraform: provider versions in required_providers, and the
  # .terraform.lock.hcl committed in each root.
  #
  # Dependabot looks at the .tf files and the lock file in each
  # directory you list. It does not walk into subdirectories on its
  # own, so each root is named below. All six declare hashicorp/aws
  # and hashicorp/null. terraform/gha-deployer also declares
  # hashicorp/tls. Listing them on one entry means the
  # open-pull-request cap and the minor/patch group apply once,
  # across every root, instead of six separate queues.
  #
  # Each root commits .terraform.lock.hcl, generated for linux_amd64,
  # darwin_arm64, and darwin_amd64. A new provider release inside the
  # pessimistic constraint updates that lock file, so Dependabot opens
  # a pull request for it. A release outside the constraint, such as a
  # 7.0 provider, also changes the version line. That one is a major
  # update and stays its own pull request. The version lines stay
  # pessimistic (~> 6.68 in terraform/backup, ~> 6.69 in the other roots).
  - package-ecosystem: "terraform"
    directories:
      # Game-night instance and the blitz DNS record. down destroys this.
      - "/terraform"
      # S3 bucket the scores are copied to. Kept across nights.
      - "/terraform/backup"
      # S3 bucket that stores Terraform state.
      - "/terraform/state"
      # IAM user for the Linux assistant, and the monthly budget.
      - "/terraform/iam-bot"
      # Instance role and instance profile. You apply this; down does not.
      - "/terraform/game-role"
      # GitHub OIDC deployer role for the Game night workflow. You apply this.
      - "/terraform/gha-deployer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Same bundle as the pip entry. A provider major (5.x to 6.x)
      # stays its own pull request.
      minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # docker: the FROM line in the Dockerfile at the repository root.
  #
  # The base image is python:3.11-slim pinned with a digest. Dependabot
  # reads the tag and the digest together and opens a pull request that
  # moves both when 3.11-slim points at a new build. The scorekeeper
  # image published to ghcr.io is not a Dockerfile FROM, so this entry
  # does not bump app_image. That pin is a Terraform variable.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
